spring:
  application:
    name: webrafaellucena

  datasource:
    url: jdbc:mysql://localhost:3306/portfolio_pintor?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid
    username: portfolio_user
    password: portfolio_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

contacto:
  destino: ${MAIL_DESTINO:info.rafaellucena@gmail.com}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD}

server:
  port: 8080